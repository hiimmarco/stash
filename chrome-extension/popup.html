<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #e5e5e7;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .settings-link {
      font-size: 12px;
      color: #86868b;
      text-decoration: none;
      cursor: pointer;
    }
    .body { padding: 16px; }
    .url-box {
      padding: 10px 12px;
      background: #f5f5f7;
      border-radius: 10px;
      font-size: 12px;
      color: #86868b;
      word-break: break-all;
      margin-bottom: 12px;
      max-height: 40px;
      overflow: hidden;
    }
    .detected {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #f5f5f7;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .detected-icon { font-size: 20px; }
    .detected-text h2 { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .detected-text p { font-size: 11px; color: #86868b; margin-top: 2px; }
    .save-btn {
      width: 100%;
      padding: 12px;
      background: #1d1d1f;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .save-btn:disabled { opacity: 0.5; }
    .save-btn:hover:not(:disabled) { background: #333; }
    .shortcut {
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: #c7c7cc;
    }
    .status {
      text-align: center;
      padding: 24px 16px;
    }
    .status.success { color: #1d1d1f; }
    .status.error { color: #ff3b30; }
    .status-icon { font-size: 28px; margin-bottom: 6px; }
    .status-text { font-size: 13px; font-weight: 500; }
    .settings-view { padding: 16px; }
    .settings-view label { font-size: 12px; color: #86868b; display: block; margin-bottom: 4px; }
    .settings-view input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e5e5e7;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }
    .settings-view input:focus { border-color: #86868b; }
    .settings-save-btn {
      width: 100%;
      padding: 10px;
      background: #1d1d1f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Stash</h1>
    <a class="settings-link" id="settingsToggle">Settings</a>
  </div>

  <div id="mainView" class="body">
    <div class="url-box" id="urlBox">Loading...</div>
    <div class="detected" id="detected" style="display:none;">
      <span class="detected-icon" id="typeIcon"></span>
      <div class="detected-text">
        <h2 id="pageTitle"></h2>
        <p id="pageMeta"></p>
      </div>
    </div>
    <button class="save-btn" id="saveBtn" disabled>Save to Stash</button>
    <div class="shortcut">&#8984;+Shift+S to quick-save</div>
  </div>

  <div id="statusView" style="display:none;">
    <div class="status" id="statusContent"></div>
  </div>

  <div id="settingsView" class="settings-view" style="display:none;">
    <label>Stash URL (your deployed app)</label>
    <input type="url" id="baseUrlInput" placeholder="https://stash.yourdomain.com" />
    <button class="settings-save-btn" id="settingsSaveBtn">Save Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
